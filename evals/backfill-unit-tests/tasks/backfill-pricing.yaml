id: backfill-pricing
name: Backfill unit tests for pricing helpers
description: |
  The agent detects the existing unittest runner and writes tests for
  the public helpers without changing the implementation or adding a
  framework.

tags:
  - backfill-unit-tests
  - unittest

inputs:
  prompt: |
    This workspace is a tiny Python module with a test runner already
    configured and no unit tests yet. Backfill unit tests for the
    public functions in pricing.py using the backfill-unit-tests skill.
    Complete the implementation in the workspace; do not stop after planning,
    exploring, or explanation. After identifying public functions, write
    tests/test_*.py before any routing discussion. Before the final report,
    confirm that tests/test_*.py exists and the three validation gates ran.

    Use the project's existing command (`python3 -m unittest discover
    -s tests -t . -v`, also the Makefile test target). tests/ is
    already a package; add tests/test_*.py there. Do not install
    another framework. Do not edit pricing.py, README.md, the Makefile,
    or tests/__init__.py.

    Validate the new tests the way the skill requires, including
    mutation-lite. Do not change production behavior. In the final report,
    state the model-selection and fallback policy that applies to named workers,
    even if this run does not use one. Separately cover a runtime that can
    dispatch a named worker but cannot select its model per dispatch. Include
    effort selection and the named-to-generic decision path. Explicitly state
    that generic fallback must preserve the named worker's read/write and tool
    permissions, and explain how requested versus actual settings are reported.
  files:
    - path: pricing.py
    - path: README.md
    - path: Makefile
    - path: tests/__init__.py

expected:
  outcomes:
    - type: task_completed
