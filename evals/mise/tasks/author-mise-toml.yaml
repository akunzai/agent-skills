id: author-mise-toml
name: Author a root mise.toml from Makefile scripts
description: |
  The agent creates one root mise.toml as the single version source,
  converts the Makefile/npm script targets to tasks, and does not
  invent extra config files.

tags:
  - mise
  - toolchain

inputs:
  prompt: |
    This workspace is a small Node project that still uses a Makefile
    and a package.json packageManager field. Add a root mise.toml that
    follows the mise skill.

    Pin tools explicitly in [tools], including at least one linter set
    to latest. Convert the existing test and lint scripts into [tasks]
    that preserve the same names. Prefer built-in backends. Do not use
    the ubi: backend. Do not keep package.json packageManager as a
    second version source.

    Also say how CI should call this file with jdx/mise-action. Do not
    invent extra files beyond mise.toml and an edit to package.json if
    you remove packageManager. Do not edit the Makefile.
  files:
    - path: Makefile
    - path: package.json

expected:
  outcomes:
    - type: task_completed
