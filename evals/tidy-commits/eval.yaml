name: tidy-commits-eval
description: |
  Isolated-workspace suite for tidy-commits. The agent plans a rewrite
  of a supplied commit listing and does not run rebase or push.
skill: tidy-commits
schemaVersion: "1.0"
version: "1.0"

config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  executor: copilot-sdk
  model: anthropic/claude-haiku-5.5
  inject_skill_body: true

metrics:
  - name: tidy_plan
    weight: 1.0
    threshold: 1.0
    description: Isolated-workspace graders for a tidy-commits plan

graders:
  - type: text
    name: checks-in-primary
    config:
      regex_match:
        - "(?is)(tests?|linters?|checks?).{0,200}(primary|main session|this session|(not|rather than|instead of).{0,40}(sub.?agent|worker|delegat))|(primary|main session|this session|(not|rather than|instead of).{0,40}(sub.?agent|worker|delegat)).{0,300}(tests?|linters?|checks?)"
        - "(?is)(tree|diff).{0,200}(identical|unchanged|same|match|preserv|no difference|empty).{0,300}(skip|not.{0,20}(run|needed|necessary))|(skip|not.{0,20}(run|needed|necessary)).{0,300}(tree|diff).{0,200}(identical|unchanged|same|match|preserv|no difference|empty)"

  - type: text
    name: required-plan-structure
    config:
      contains:
        - "Plan"
        - "backup"

  - type: text
    name: uses-skill-operations
    config:
      regex_match:
        - "(?i)fix.?up"
        - "(?i)GIT_SEQUENCE_EDITOR|non-interactive|GIT_EDITOR=true"

  - type: code
    name: classifies-history
    config:
      assertions:
        - "len(output) > 200"
        - "'parser' in output.lower() or 'cli' in output.lower()"
        - "'drop' in output.lower() or 'debug' in output.lower()"

  - type: file
    name: workspace-unmutated
    config:
      must_exist:
        - HISTORY.txt
      must_not_exist:
        - .env
        - rebase-todo

  - type: diff
    name: history-listing-unmutated
    config:
      expected_files:
        - path: HISTORY.txt
          snapshot: evals/tidy-commits/fixtures/HISTORY.txt

tasks:
  - "tasks/*.yaml"
