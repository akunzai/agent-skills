name: tidy-commits-eval
description: |
  Isolated-workspace suite for tidy-commits. The agent plans a rewrite
  of a supplied commit listing and does not run rebase or push.
skill: tidy-commits
schemaVersion: "1.0"
version: "1.0"

config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  executor: copilot-sdk
  model: gemini-3.7-flash
  inject_skill_body: true

metrics:
  - name: tidy_plan
    weight: 1.0
    threshold: 1.0
    description: Isolated-workspace graders for a tidy-commits plan

graders:
  - type: text
    name: worker-model-routing
    config:
      regex_match:
        - "(?is)(cheapest|lowest.cost).*(model|task|work)"
        - "(?is)(lowest|low).*effort"
        - "(?is)(named|role).*(unavailable|unsupported|missing|fail.{0,40}pre.execution).*generic"
        - "(?is)generic.*(read.only|permission|tool|tracked.source|git.state)"
        - "(?is)(requested|actual|inherited|unknown).*(model|effort)|(model|effort).*(requested|actual|inherited|unknown)"
        - "(?is)named.{0,200}(capacity|pre.execution).{0,200}generic.{0,200}(permission|tool|read.only|tracked.source|git.state)"
        - "(?is)generic.{0,200}(capacity|pre.execution).{0,200}primary"
        - "(?is)((ambiguous|unclear|unknown).{0,200}stop|stop.{0,200}(ambiguity|ambiguous|unclear|unknown))"
        - "(?is)(once|after).{0,160}(start|begin|exec).{0,160}(fail|result).{0,160}(final|not.*rerun|no.*rerun)"

  - type: text
    name: required-plan-structure
    config:
      contains:
        - "Plan"
        - "backup"

  - type: text
    name: uses-skill-operations
    config:
      contains:
        - "fixup"
      regex_match:
        - "(?i)GIT_SEQUENCE_EDITOR|non-interactive|GIT_EDITOR=true"

  - type: code
    name: classifies-history
    config:
      assertions:
        - "len(output) > 200"
        - "'parser' in output.lower() or 'cli' in output.lower()"
        - "'drop' in output.lower() or 'debug' in output.lower()"

  - type: file
    name: workspace-unmutated
    config:
      must_exist:
        - HISTORY.txt
      must_not_exist:
        - .env
        - rebase-todo

  - type: diff
    name: history-listing-unmutated
    config:
      expected_files:
        - path: HISTORY.txt
          snapshot: evals/tidy-commits/fixtures/HISTORY.txt

tasks:
  - "tasks/*.yaml"
