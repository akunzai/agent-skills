name: "PR Auto Labeler"

on:  # zizmor: ignore[dangerous-triggers] no checkout of PR content; only calls the GitHub API (add/remove labels) with the elevated token
  pull_request_target:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read
  pull-requests: write

jobs:
  labeler:
    runs-on: ubuntu-latest
    steps:
      - name: Apply labels based on branch name prefix and title
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const pr = context.payload.pull_request;
            const issue = { owner: context.repo.owner, repo: context.repo.repo, issue_number: pr.number };
            const currentLabels = (pr.labels || []).map(l => l.name);

            // A Conventional Commit "!" in the title marks a breaking change. A scope
            // naming a plugin (a directory under plugins/) or "plugins" gets
            // "plugin-breaking": it does not move the catalog version.
            const bang = (pr.title || "").match(/^[a-z]+(?:\(([^)]*)\))?!:/i);
            let breakingLabel = null;
            if (bang) {
              breakingLabel = "breaking";
              if (bang[1]) {
                try {
                  const { data } = await github.rest.repos.getContent({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    path: "plugins",
                    ref: context.payload.repository.default_branch,
                  });
                  const plugins = data.filter(e => e.type === "dir").map(e => e.name);
                  if (bang[1] === "plugins" || plugins.includes(bang[1])) breakingLabel = "plugin-breaking";
                } catch (err) {
                  console.log(`Could not list plugins/: ${err.message}`);
                }
              }
            }
            for (const name of ["breaking", "plugin-breaking"]) {
              if (name === breakingLabel && !currentLabels.includes(name)) {
                await github.rest.issues.addLabels({ ...issue, labels: [name] });
                console.log(`Added label "${name}" to PR #${pr.number}`);
              } else if (name !== breakingLabel && currentLabels.includes(name)) {
                await github.rest.issues.removeLabel({ ...issue, name });
                console.log(`Removed label "${name}" from PR #${pr.number}`);
              }
            }

            const branch = pr.head.ref || "";
            const match = branch.match(/^([a-zA-Z]+)\//);
            if (!match) {
              console.log(`No recognized prefix in branch name: "${branch}"`);
              return;
            }

            const prefixMap = {
              feat: "enhancement",
              feature: "enhancement",
              fix: "bug",
              bug: "bug",
              docs: "documentation",
              doc: "documentation",
              ci: "ci",
              build: "ci",
              chore: "chore",
              release: "chore",
              refactor: "refactor",
              test: "tests",
              tests: "tests",
              perf: "enhancement",
            };

            const primaryCategoryLabels = [
              "enhancement",
              "bug",
              "documentation",
              "ci",
              "chore",
              "refactor",
              "tests",
              "dependencies",
            ];

            const targetLabel = prefixMap[match[1].toLowerCase()];
            if (!targetLabel) return;

            // Remove other conflicting primary category labels
            for (const oldLabel of currentLabels) {
              if (oldLabel !== targetLabel && primaryCategoryLabels.includes(oldLabel)) {
                try {
                  await github.rest.issues.removeLabel({ ...issue, name: oldLabel });
                  console.log(`Removed conflicting label "${oldLabel}" from PR #${pr.number}`);
                } catch (err) {
                  console.log(`Failed to remove label "${oldLabel}": ${err.message}`);
                }
              }
            }

            if (!currentLabels.includes(targetLabel)) {
              await github.rest.issues.addLabels({ ...issue, labels: [targetLabel] });
              console.log(`Added label "${targetLabel}" to PR #${pr.number}`);
            }
