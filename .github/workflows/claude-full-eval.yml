name: Claude full evaluation

on:
  workflow_dispatch:
    inputs:
      model:
        description: OpenRouter model identifier
        required: true
        default: anthropic/claude-sonnet-5
        type: string
      max_turns:
        description: Maximum Claude agent turns per fixture replica
        required: true
        default: '8'
        type: string
      max_budget_usd:
        description: Maximum OpenRouter spend per fixture replica in USD
        required: true
        default: '2'
        type: string

permissions:
  contents: read

jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: skills-evals
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      ANTHROPIC_BASE_URL: https://openrouter.ai/api
      ANTHROPIC_AUTH_TOKEN: ${{ secrets.OPENROUTER_API_KEY }}
      ANTHROPIC_API_KEY: ''
      MODEL: ${{ inputs.model }}
      MAX_TURNS: ${{ inputs.max_turns }}
      MAX_BUDGET_USD: ${{ inputs.max_budget_usd }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code@2.1.220

      - name: Run Claude full evaluation
        run: |
          ARTIFACT_DIR="$RUNNER_TEMP/claude-full-artifacts"
          evals/run-claude-full.sh \
            --artifact-dir "$ARTIFACT_DIR" \
            --model "$MODEL" \
            --max-turns "$MAX_TURNS" \
            --max-budget-usd "$MAX_BUDGET_USD"

      - name: Upload evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: claude-full-evaluation
          path: ${{ runner.temp }}/claude-full-artifacts
          if-no-files-found: warn
          retention-days: 30
