name: API paired skill evaluation

on:
  workflow_dispatch:
    inputs:
      target_models:
        description: Comma-separated OpenRouter model identifiers for the target sweep
        required: true
        default: openai/gpt-5.6-luna,x-ai/grok-4.5,google/gemini-3.6-flash
        type: string
      judge_model:
        description: One independent OpenRouter model identifier used as the judge
        required: true
        default: anthropic/claude-sonnet-5
        type: string
permissions:
  contents: read

concurrency:
  group: api-paired-evaluation
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: skills-evals
    env:
      TARGET_MODELS: ${{ inputs.target_models }}
      JUDGE_MODEL: ${{ inputs.judge_model }}
      MAX_ARTIFACT_BYTES: '65536'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Validate fixture and snapshot profile
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/api-paired-artifacts"
          profile_path="$artifact_dir/profile.json"
          mkdir -p "$artifact_dir"
          bash tests/api-fixtures.sh
          evals/api-evaluation-profile.sh \
            --target-models "$TARGET_MODELS" \
            --judge-model "$JUDGE_MODEL" \
            --output "$profile_path"
          jq -e '
            .status == "valid"
            and .result_type == "profile"
            and .request.max_turns == 1
            and .request.timeout_seconds == 120
            and .request.max_tokens == 2048
            and .request.stream == false
            and .provider_routing.allow_fallbacks == false
          ' "$profile_path" >/dev/null

      - name: Record manual run metadata
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/api-paired-artifacts"
          profile_path="$artifact_dir/profile.json"
          target_count="$(jq -r '.target_models | length' "$profile_path")"
          request_count=$((target_count * 4))
          jq -n \
            --arg policy "api-paired-manual-v2" \
            --arg budget_policy "openrouter_account" \
            --argjson target_count "$target_count" \
            --argjson request_count "$request_count" \
            --argjson max_artifact_bytes "$MAX_ARTIFACT_BYTES" \
            ' {
              schema_version: 1,
              policy: $policy,
              budget_enforcement: $budget_policy,
              target_count: $target_count,
              request_count: $request_count,
              request: {
                max_turns: 1,
                timeout_seconds: 120,
                candidate_max_tokens: 2048,
                judge_max_tokens: 512,
                judge_response_format: "json_schema",
                stream: false,
                provider_fallbacks: false
              },
              artifact: {
                max_bytes: $max_artifact_bytes,
                retention_days: 30,
                raw_provider_material_persisted: false
              }
            } ' >"$artifact_dir/run-policy.json"

      - name: Run manual API paired evaluation
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/api-paired-artifacts"
          profile_path="$artifact_dir/profile.json"
          set +e
          timeout --signal=TERM --kill-after=30s 25m \
            evals/run-api-paired.sh \
              --profile "$profile_path" \
              --task-file evals/fixtures/api/agents-md/representative-task/task.txt \
              --task-revision agents-md-task-v1 \
              --skill-file skills/agents-md/SKILL.md \
              --skill-revision agents-md-skill-v1 \
              --skill-name agents-md \
              --fixture-revision agents-md-api-v1 \
              --rubric-file evals/fixtures/api/agents-md/representative-task/rubric.json \
              --rubric-revision agents-md-micromanagement-v1 \
              --artifact-dir "$artifact_dir"
          runner_exit=$?
          set -e
          if [ "$runner_exit" -eq 124 ] || [ "$runner_exit" -eq 137 ]; then
            jq -n '
              {
                schema_version: 1,
                suite: "api-skill-utility",
                runner: "openrouter-one-turn-paired",
                result_type: "infrastructure",
                status: "failed",
                outcome: "not-scored",
                error: {
                  type: "infrastructure",
                  category: "transport",
                  code: "request_timeout",
                  message: "The manual workflow timeout stopped the paired runner before completion."
                }
              }
            ' >"$artifact_dir/timeout-failure.json"
            exit 1
          fi
          exit "$runner_exit"

      - name: Summarize API evaluation
        if: always()
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/api-paired-artifacts"
          results_path="$artifact_dir/results.json"
          summary_path="$GITHUB_STEP_SUMMARY"

          if [ -f "$results_path" ] && jq -e . "$results_path" >/dev/null 2>&1; then
            runner_status="$(jq -r '.status // "unknown"' "$results_path")"
            runner_outcome="$(jq -r '.outcome // "unknown"' "$results_path")"
            {
              echo "## API evaluation diagnostics"
              echo
              echo "- Runner: \`$runner_status\` / \`$runner_outcome\`"
              echo "- Budget: enforced by the OpenRouter account; no workflow-local spend gate."
            } >>"$summary_path"

            if jq -e '(.pairs | type) == "array"' "$results_path" >/dev/null; then
              {
                echo
                echo "| Target | Pair | Treatment | Control | Treatment judge | Control judge |"
                echo "| --- | --- | --- | --- | --- | --- |"
                jq -r '
                  def router($result):
                    if (($result.response.router_metadata | type) == "object") then
                      " / router=attempt:" +
                      (($result.response.router_metadata.attempt // "-") | tostring)
                      + ",strategy:" +
                      (($result.response.router_metadata.strategy // "-") | tostring)
                      + ",endpoints:" +
                      (($result.response.router_metadata.endpoints.available_count // "-") | tostring)
                      + "/" +
                      (($result.response.router_metadata.endpoints.selected_count // "-") | tostring)
                    else ""
                    end;
                  def phase($result):
                    (($result.status // "missing")
                      + " / HTTP " + (($result.response.http_status // "-") | tostring)
                      + " / " + ($result.error.code // "none")
                      + " / provider=" + ($result.error.diagnostics.provider_error_type // "none")
                      + router($result));
                  .pairs[]
                  | "| \u0060" + .target_model + "\u0060 | \u0060" + (.status // "missing")
                    + "\u0060 | \u0060" + phase(.treatment)
                    + "\u0060 | \u0060" + phase(.control)
                    + "\u0060 | \u0060" + phase(.treatment.judge)
                    + "\u0060 | \u0060" + phase(.control.judge) + "\u0060 |"
                ' "$results_path"
              } >>"$summary_path"
            else
              failure_code="$(jq -r '.error.code // "unknown"' "$results_path")"
              echo "- No paired result rows were produced; artifact error: \`$failure_code\`." \
                >>"$summary_path"
            fi

            if [ "$runner_status" != "completed" ]; then
              annotation="::error title=API paired runner failed::status=$runner_status"
              annotation+=" outcome=$runner_outcome; inspect the diagnostics table and artifact."
              printf '%s\n' "$annotation"
            fi

            while IFS=$'\t' read -r target phase code http_status; do
              if [ "$code" != "none" ] \
                && [ "$code" != "candidate_response_unavailable" ]; then
                printf '::error title=API paired %s failed::target=%s code=%s http=%s\n' \
                  "$phase" "$target" "$code" "$http_status"
              fi
            done < <(jq -r '
              select((.pairs | type) == "array")
              | .pairs[] as $pair
              | [
                  {target: $pair.target_model, phase: "treatment", result: $pair.treatment},
                  {target: $pair.target_model, phase: "control", result: $pair.control},
                  {target: $pair.target_model, phase: "treatment-judge", result: $pair.treatment.judge},
                  {target: $pair.target_model, phase: "control-judge", result: $pair.control.judge}
                ][]
              | [
                  .target,
                  .phase,
                  (.result.error.code // "none"),
                  (.result.response.http_status // "-")
                ]
              | @tsv
            ' "$results_path")
          else
            {
              echo "## API evaluation diagnostics"
              echo
              echo "- Runner: no valid results artifact was produced."
            } >>"$summary_path"
            printf '::error title=API paired runner failed::no valid results artifact was produced.\n'
          fi

          for failure_name in timeout-failure; do
            failure_path="$artifact_dir/$failure_name.json"
            if [ -f "$failure_path" ] && jq -e . "$failure_path" >/dev/null 2>&1; then
              failure_code="$(jq -r '.error.code // "unknown"' "$failure_path")"
              echo "- \`$failure_name\`: \`$failure_code\`" >>"$summary_path"
              printf '::error title=API paired %s::code=%s\n' "$failure_name" "$failure_code"
            fi
          done

      - name: Upload API evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-paired-evaluation-${{ github.run_id }}
          path: ${{ runner.temp }}/api-paired-artifacts
          if-no-files-found: warn
          retention-days: 30
