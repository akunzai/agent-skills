name: Waza evaluation

on:
  pull_request:
    branches: [main]
    paths:
      - "skills/**"
      - "evals/**"
      - ".github/workflows/waza-eval.yml"
      - ".waza.yaml"
      - "mise.toml"
  workflow_dispatch:
    inputs:
      baseline:
        description: Run waza --baseline (effectiveness). Allowed on dispatch only, not on the PR job.
        required: false
        type: boolean
        default: false
      suite:
        description: Suite directory under evals/ (empty = all suites)
        required: false
        type: string
        default: ""

permissions:
  contents: read
  copilot-requests: write

jobs:
  evaluate:
    name: Evaluate skills with Waza
    if: >
      github.event_name == 'workflow_dispatch'
      || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Fetch origin/main
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - name: Set up mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: github:microsoft/waza@0.38.7

      - name: Check token budget
        run: waza tokens compare origin/main --skills --threshold 10 --strict

      - name: Run Waza evaluation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          args=()
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            args+=(--changed)
          elif [ -n "${{ inputs.suite }}" ]; then
            args+=("${{ inputs.suite }}")
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
            && [ "${{ inputs.baseline }}" = "true" ]; then
            args+=(--baseline)
          fi
          bash evals/run-suites.sh "${args[@]}"

      - name: Upload Waza artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: waza-evaluation-${{ github.run_id }}
          path: |
            waza-results/
            transcripts/
          if-no-files-found: warn
          retention-days: 30
