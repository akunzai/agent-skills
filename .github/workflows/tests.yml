name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up mise
        uses: jdx/mise-action@v4

      - name: Run actionlint
        run: mise run lint-actions

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up mise
        uses: jdx/mise-action@v4

      - name: Run ShellCheck
        run: mise run lint-shell

  agents-memory:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run agents-memory project storage checks
        run: bash tests/agents-memory-storage.sh

  write-e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run write-e2e-tests scan-secrets checks
        run: bash tests/write-e2e-tests-scan-secrets.sh

  to-walkthrough-video:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Run to-walkthrough-video checks
        run: bash tests/to-walkthrough-video.sh

  setup-agent-ready-repo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run setup-agent-ready-repo drift checks
        run: bash tests/setup-agent-ready-repo-drift.sh

      - name: Run setup-agent-ready-repo eval grader checks
        run: bash tests/setup-agent-ready-repo-grader.sh

      - name: Run setup-agent-ready-repo template install checks
        run: bash tests/setup-agent-ready-repo-install-templates.sh

  skill-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run skill-catalog-sync checks
        run: bash tests/skill-catalog-sync.sh

      - name: Run interactive plugin setup checks
        run: bash tests/plugin-setup.sh

      - name: Run waza spec workflow checks
        run: bash tests/waza-spec-workflow.sh

      - name: Run waza run-suites checks
        run: bash tests/waza-run-suites.sh

      - name: Run backfill-unit-tests tests-pass grader checks
        run: bash tests/backfill-unit-tests-tests-pass-grader.sh

  agentsview-cli-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up mise
        uses: jdx/mise-action@v4

      - name: Run agentsview CLI contract checks
        run: mise run test-agentsview-contract

  codexbar-quota-handoff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run codexbar-quota-handoff manifest checks
        run: bash tests/codexbar-quota-handoff-manifest.sh

      - name: Run codexbar-quota-handoff flag-writer checks
        run: bash tests/codexbar-quota-handoff-flag-writer.sh

      - name: Run codexbar-quota-handoff quota-reminder checks
        run: bash tests/codexbar-quota-handoff-quota-reminder.sh

      - name: Run codexbar-quota-handoff threshold-validation checks
        run: bash tests/codexbar-quota-handoff-threshold-validation.sh

      - name: Run codexbar-quota-handoff install-providers checks
        run: bash tests/codexbar-quota-handoff-install-providers.sh

      - name: Run codexbar-quota-handoff uninstall checks
        run: bash tests/codexbar-quota-handoff-uninstall.sh

      - name: Run codexbar-quota-handoff remove-grok checks
        run: bash tests/codexbar-quota-handoff-remove-grok.sh

  plugin-version-bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run plugin version-bump checks
        run: bash tests/plugin-version-bump.sh

  bash32-compat:
    # Confirms the shipped/dev shell scripts still work on macOS's stock
    # /bin/bash (3.2, pre-GPLv3), not just the Bash 4+ this repo's own dev
    # shell and the other ubuntu-latest jobs use. No mise setup: jq and
    # python3 are already on the macos-latest image, and the point is to
    # exercise the system bash rather than a tool this repo's own toolchain
    # provides.
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Confirm the system bash is the pre-4.0 version these tests target
        run: /bin/bash --version

      - name: Run plugin setup checks under /bin/bash
        run: /bin/bash tests/plugin-setup.sh

      - name: Run setup-agent-ready-repo template install checks under /bin/bash
        run: /bin/bash tests/setup-agent-ready-repo-install-templates.sh

      - name: Run waza run-suites checks under /bin/bash
        run: /bin/bash tests/waza-run-suites.sh

      - name: Run backfill-unit-tests tests-pass grader checks under /bin/bash
        run: /bin/bash tests/backfill-unit-tests-tests-pass-grader.sh

  spoken:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run spoken manifest checks
        run: bash tests/spoken-manifest.sh

      - name: Run spoken CLI checks
        run: bash tests/spoken-cli.sh

  cheap-dev-workers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run cheap-dev-workers manifest checks
        run: bash tests/cheap-dev-workers-manifest.sh

      - name: Run cheap-dev-workers agents content checks
        run: bash tests/cheap-dev-workers-agents-content.sh

      - name: Run cheap-dev-workers Worker Role render checks
        run: bash tests/cheap-dev-workers-roles-render.sh

      - name: Run cheap-dev-workers setup/uninstall checks
        run: bash tests/cheap-dev-workers-setup-uninstall.sh

      - name: Run cheap-dev-workers sanitization checks
        run: bash tests/cheap-dev-workers-sanitize-log.sh
