name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1

      - name: Run actionlint
        run: mise run lint-actions

      - name: Run PR labeler behavior checks
        run: bash tests/pr-labeler.sh

  zizmor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1

      - name: Run zizmor
        run: mise run lint-workflows

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up mise
        uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1

      - name: Run gitleaks
        run: mise run lint-secrets

  hidden-unicode:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run hidden-unicode checks
        run: bash tests/hidden-unicode.sh

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1

      - name: Run ShellCheck
        run: mise run lint-shell

  agents-memory:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run agents-memory project storage checks
        run: bash tests/agents-memory-storage.sh

  write-e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run write-e2e-tests scan-secrets checks
        run: bash tests/write-e2e-tests-scan-secrets.sh

  record-walkthrough:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Run record-walkthrough checks
        run: bash tests/record-walkthrough.sh

  setup-agent-ready-repo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run setup-agent-ready-repo drift checks
        run: bash tests/setup-agent-ready-repo-drift.sh

      - name: Run setup-agent-ready-repo eval grader checks
        run: bash tests/setup-agent-ready-repo-grader.sh

      - name: Run setup-agent-ready-repo template install checks
        run: bash tests/setup-agent-ready-repo-install-templates.sh

  skill-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run skill-catalog-sync checks
        run: bash tests/skill-catalog-sync.sh

      - name: Run skill capabilities checks
        run: bash tests/skill-capabilities.sh

      - name: Run skill frontmatter checks
        run: bash tests/skill-frontmatter.sh

      - name: Run interactive plugin setup checks
        run: bash tests/plugin-setup.sh

      - name: Run waza spec workflow checks
        run: bash tests/waza-spec-workflow.sh

      - name: Run waza run-suites checks
        run: bash tests/waza-run-suites.sh

      - name: Run backfill-unit-tests tests-pass grader checks
        run: bash tests/backfill-unit-tests-tests-pass-grader.sh

  sign-skills:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1

      - name: Run sign-skills checks
        run: bash tests/sign-skills.sh

  bump-pinned-tools:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run bump-pinned-tools checks
        run: bash tests/bump-pinned-tools.sh

  agentsview-cli-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1

      - name: Run agentsview CLI contract checks
        run: mise run test-agentsview-contract

  codexbar-quota-handoff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run codexbar-quota-handoff manifest checks
        run: bash tests/codexbar-quota-handoff-manifest.sh

      - name: Run codexbar-quota-handoff flag-writer checks
        run: bash tests/codexbar-quota-handoff-flag-writer.sh

      - name: Run codexbar-quota-handoff quota-reminder checks
        run: bash tests/codexbar-quota-handoff-quota-reminder.sh

      - name: Run codexbar-quota-handoff threshold-validation checks
        run: bash tests/codexbar-quota-handoff-threshold-validation.sh

      - name: Run codexbar-quota-handoff install-providers checks
        run: bash tests/codexbar-quota-handoff-install-providers.sh

      - name: Run codexbar-quota-handoff uninstall checks
        run: bash tests/codexbar-quota-handoff-uninstall.sh

      - name: Run codexbar-quota-handoff remove-grok checks
        run: bash tests/codexbar-quota-handoff-remove-grok.sh

  plugin-version-bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Run plugin version-bump checks
        run: bash tests/plugin-version-bump.sh

  bash32-compat:
    # Confirms the shipped/dev shell scripts still work on Bash 3.2 (stock
    # /bin/bash on macOS, pre-GPLv3), not just the Bash 4+ this repo's own
    # dev shell and the other ubuntu-latest jobs use. Compiles Bash 3.2.57
    # on Ubuntu and caches the binary, running the suite under Linux Actions
    # runner without consuming macOS runner minutes.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache Bash 3.2 binary
        id: cache-bash32
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/bash32
          key: bash-3.2.57-ubuntu-24.04

      - name: Compile Bash 3.2
        if: steps.cache-bash32.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/.local/bash32
          build_dir="$(mktemp -d)"
          curl -fsSL https://ftp.gnu.org/gnu/bash/bash-3.2.57.tar.gz | tar -xz -C "$build_dir"
          cd "$build_dir/bash-3.2.57"
          export CC="gcc -std=gnu89"
          export CC_FOR_BUILD="gcc -std=gnu89"
          cflags="-std=gnu89 -Wno-error=implicit-function-declaration -Wno-error=incompatible-pointer-types -Wno-error=implicit-int"
          export CFLAGS="$cflags"
          export CFLAGS_FOR_BUILD="$cflags"
          ./configure \
            --prefix="$HOME/.local/bash32" \
            --without-bash-malloc
          make -j"$(nproc)"
          make install
          rm -rf "$build_dir"

      - name: Add Bash 3.2 to PATH
        run: |
          echo "$HOME/.local/bash32/bin" >> "$GITHUB_PATH"

      - name: Confirm the compiled bash is the pre-4.0 version these tests target
        run: |
          [[ "$("$HOME/.local/bash32/bin/bash" --version | head -1)" == *"version 3.2"* ]]
          ~/.local/bash32/bin/bash --version

      - name: Run plugin setup checks under Bash 3.2
        run: ~/.local/bash32/bin/bash tests/plugin-setup.sh

      - name: Run setup-agent-ready-repo template install checks under Bash 3.2
        run: ~/.local/bash32/bin/bash tests/setup-agent-ready-repo-install-templates.sh

      - name: Run waza run-suites checks under Bash 3.2
        run: ~/.local/bash32/bin/bash tests/waza-run-suites.sh

      - name: Run backfill-unit-tests tests-pass grader checks under Bash 3.2
        run: ~/.local/bash32/bin/bash tests/backfill-unit-tests-tests-pass-grader.sh

      - name: Run bump-pinned-tools checks under Bash 3.2
        run: ~/.local/bash32/bin/bash tests/bump-pinned-tools.sh

      - name: Run hidden-unicode checks under Bash 3.2
        run: ~/.local/bash32/bin/bash tests/hidden-unicode.sh

  spoken:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run spoken manifest checks
        run: bash tests/spoken-manifest.sh

      - name: Run spoken CLI checks
        run: bash tests/spoken-cli.sh

  cheap-dev-workers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run cheap-dev-workers manifest checks
        run: bash tests/cheap-dev-workers-manifest.sh

      - name: Run cheap-dev-workers agents content checks
        run: bash tests/cheap-dev-workers-agents-content.sh

      - name: Run cheap-dev-workers Worker Role render checks
        run: bash tests/cheap-dev-workers-roles-render.sh

      - name: Run cheap-dev-workers setup/uninstall checks
        run: bash tests/cheap-dev-workers-setup-uninstall.sh

      - name: Run cheap-dev-workers sanitization checks
        run: bash tests/cheap-dev-workers-sanitize-log.sh
