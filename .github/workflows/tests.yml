name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up mise
        uses: jdx/mise-action@v4

      - name: Run actionlint
        run: mise run lint-actions

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up mise
        uses: jdx/mise-action@v4

      - name: Run ShellCheck
        run: mise run lint-shell

  agents-md:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run agents-md name checks
        run: bash tests/agents-md-name.sh

      - name: Run agents-md content checks
        run: bash tests/agents-md-content.sh

  claude-evals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run Claude smoke evaluation checks
        run: bash tests/claude-smoke-eval.sh

      - name: Run Claude smoke workflow checks
        run: bash tests/claude-smoke-eval-workflow.sh

      - name: Run Claude full evaluation checks
        run: bash tests/claude-full-eval.sh

      - name: Run Claude full workflow checks
        run: bash tests/claude-full-eval-workflow.sh

  codex-evals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run Codex smoke evaluation checks
        run: bash tests/codex-smoke-eval.sh

      - name: Run Codex smoke workflow checks
        run: bash tests/codex-smoke-eval-workflow.sh

  grok-evals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run Grok smoke evaluation checks
        run: bash tests/grok-smoke-eval.sh

      - name: Run Grok smoke workflow checks
        run: bash tests/grok-smoke-eval-workflow.sh

  git-sync-memory:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run git-sync-memory integration tests
        run: bash tests/git-sync-memory-integration.sh

      - name: Run git-sync-memory branch derivation tests
        run: bash tests/git-sync-memory-branch.sh

      - name: Run memory content checks
        run: bash tests/memory-content.sh

  tidy-commits:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run tidy-commits content checks
        run: bash tests/tidy-commits-content.sh

  github-epic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run github-epic content checks
        run: bash tests/github-epic-content.sh

  gitlab-epic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run gitlab-epic content checks
        run: bash tests/gitlab-epic-content.sh

  pr-workflow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run pr-workflow content checks
        run: bash tests/pr-workflow-content.sh

  mise:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run mise content checks
        run: bash tests/mise-content.sh

  aube:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run aube content checks
        run: bash tests/aube-content.sh

  agentsview-extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run agentsview-extract content checks
        run: bash tests/agentsview-extract-content.sh

  mem-setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up mise
        uses: jdx/mise-action@v4

      - name: Run mem-setup content checks
        run: bash tests/mem-setup-content.sh

      - name: Run mem-setup bridge checks
        run: bash tests/mem-setup-bridge.sh

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up mise
        uses: jdx/mise-action@v4

      - name: Run Windows POSIX path-guard tests
        run: bash tests/windows-path-guard.sh

      - name: Run git-sync-memory integration tests
        run: bash tests/git-sync-memory-integration.sh

      - name: Run git-sync-memory branch derivation tests
        run: bash tests/git-sync-memory-branch.sh

      - name: Run mem-setup bridge checks
        run: bash tests/mem-setup-bridge.sh
