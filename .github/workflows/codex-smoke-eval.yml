name: Codex smoke comparison

on:
  workflow_dispatch:
    inputs:
      model:
        description: Requested Codex model identifier
        required: true
        default: openai/gpt-5.6-luna
        type: string
      effort:
        description: Codex reasoning effort
        required: true
        default: medium
        type: choice
        options: [low, medium, high, xhigh]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: skills-evals
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Prepare Codex Linux sandbox
        run: |
          sudo apt-get update
          sudo apt-get install --yes apparmor-profiles apparmor-utils bubblewrap
          sudo install -m 0644 \
            /usr/share/apparmor/extra-profiles/bwrap-userns-restrict \
            /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict

      - name: Install Codex CLI
        run: npm install --global @openai/codex@0.146.0

      - name: Run Codex smoke comparison
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MODEL: ${{ inputs.model }}
          EFFORT: ${{ inputs.effort }}
        run: |
          ARTIFACT_DIR="$RUNNER_TEMP/codex-smoke-artifacts"
          evals/run-codex-smoke.sh \
            --artifact-dir "$ARTIFACT_DIR" \
            --model "$MODEL" \
            --effort "$EFFORT"

      - name: Upload evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: codex-smoke-comparison
          path: ${{ runner.temp }}/codex-smoke-artifacts
          if-no-files-found: warn
          retention-days: 30
