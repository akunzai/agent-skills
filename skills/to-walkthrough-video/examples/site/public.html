<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fixture — public</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header>
      <h1>Walkthrough fixture</h1>
      <a href="/login">Sign in</a>
    </header>
    <main>
      <p>This page needs no session. It exists so a walkthrough can be recorded offline.</p>
      <p><a href="#more">More information</a></p>
      <label for="q">Search</label>
      <input id="q" type="search" placeholder="Type here" />
      <label for="lang">Language</label>
      <select id="lang">
        <option>English</option>
        <option>日本語</option>
        <option>繁體中文</option>
      </select>
      <p id="hint" hidden>Command palette opened.</p>
      <p><button type="button" id="details-toggle">Details</button></p>
      <p id="details" hidden>Double-clicking reveals these details.</p>
      <section id="more">
        <h2>More information</h2>
        <p>Anchored so the click never leaves the page and the later locators stay valid.</p>
      </section>
    </main>
    <script>
      // A shortcut with a visible result, so a `press` step has something to show.
      document.addEventListener("keydown", (event) => {
        if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "k") {
          event.preventDefault();
          document.getElementById("hint").hidden = false;
          document.getElementById("q").focus();
        }
      });
      // A double-click target, so a `dblclick` step has something to show.
      document.getElementById("details-toggle").addEventListener("dblclick", () => {
        const details = document.getElementById("details");
        details.hidden = !details.hidden;
      });
    </script>
  </body>
</html>
