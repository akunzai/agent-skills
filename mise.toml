[tools]
shellcheck = "latest"
actionlint = "latest"
uv = "latest"
jq = "latest"

[tasks.test]
description = "Run all test scripts"
run = '''
exit_code=0
for t in tests/*.sh; do
  if bash "$t"; then
    printf 'PASS: %s\n' "$t"
  else
    printf 'FAIL: %s\n' "$t"
    exit_code=1
  fi
done
exit $exit_code
'''

[tasks.lint-shell]
description = "Lint shell scripts with ShellCheck"
run = "find tests skills evals -name '*.sh' -type f -exec shellcheck {} +"

[tasks.lint-actions]
description = "Lint GitHub Actions workflows with actionlint"
run = "actionlint"

[tasks.lint]
description = "Run all linters"
depends = ["lint-shell", "lint-actions"]

[tasks.eval-claude-smoke]
description = "Run the manual Claude Code smoke-evaluation fixtures"
run = "evals/run-claude-smoke.sh"

[tasks.eval-claude-full]
description = "Run the manual three-replica Claude Code release baseline"
run = "evals/run-claude-full.sh"

[tasks.eval-codex-smoke]
description = "Run the manual native Codex CLI smoke comparison"
run = "evals/run-codex-smoke.sh"

[tasks.eval-grok-smoke]
description = "Run the manual native Grok Build smoke comparison"
run = "evals/run-grok-smoke.sh"
