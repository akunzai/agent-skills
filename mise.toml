[tools]
shellcheck = "latest"
actionlint = "latest"
uv = "latest"
jq = "latest"

# CLI tags are vX.Y.Z. Without the prefix, latest can resolve to an azd-ext release.
[tools."github:microsoft/waza"]
version = "latest"
version_prefix = "v"

[tasks.test]
description = "Run all test scripts"
run = '''
exit_code=0
for t in tests/*.sh; do
  if bash "$t"; then
    printf 'PASS: %s\n' "$t"
  else
    printf 'FAIL: %s\n' "$t"
    exit_code=1
  fi
done
exit $exit_code
'''

[tasks.lint-shell]
description = "Lint shell scripts with ShellCheck"
run = "find tests skills evals plugins -name '*.sh' -type f -exec shellcheck {} +"

[tasks.lint-actions]
description = "Lint GitHub Actions workflows with actionlint"
run = "actionlint"

[tasks.lint]
description = "Run all linters"
depends = ["lint-shell", "lint-actions"]

[tasks.waza]
description = "Run every Waza eval suite"
run = '''
set -euo pipefail
failed=0
mkdir -p waza-results
for spec in evals/*/eval.yaml; do
  name="$(basename "$(dirname "$spec")")"
  if ! waza run "$spec" --output "waza-results/${name}.json"; then
    failed=1
  fi
done
exit "$failed"
'''
