[tools]
shellcheck = "latest"
actionlint = "latest"
uv = "latest"
jq = "latest"

# Pinned exact (not "latest"): zizmor's own findings can change between
# releases, so a workflow that passes today must not start failing CI on
# an unrelated tool bump.
zizmor = "1.30.1"

# Pinned exact for the same reason as zizmor: gitleaks' own detection rules
# can change between releases, so a scan that passes today must not start
# failing CI on an unrelated tool bump.
gitleaks = "8.30.1"

# Pin the CLI tag. GitHub /releases/latest is the azd-ext release, and
# mise 2026.8.6 cannot resolve latest+version_prefix=v (empty version list).
[tools."github:microsoft/waza"]
version = "0.38.7"
version_prefix = "v"

[tasks.test]
description = "Run all test scripts"
depends = ["test-agentsview-contract"]
run = '''
exit_code=0
for t in tests/*.sh; do
  # run by the test-agentsview-contract task, which supplies the CLI
  if [ "$t" = "tests/agentsview-cli-contract.sh" ]; then continue; fi
  if bash "$t"; then
    printf 'PASS: %s\n' "$t"
  else
    printf 'FAIL: %s\n' "$t"
    exit_code=1
  fi
done
exit $exit_code
'''

[tasks.render-roles]
description = "Render cheap-dev-workers native artifacts from roles/"
run = "bash plugins/cheap-dev-workers/scripts/render-roles.sh --write"

[tasks.lint-shell]
description = "Lint shell scripts with ShellCheck"
run = "find tests skills evals plugins scripts -name '*.sh' -type f -exec shellcheck {} +"

[tasks.lint-actions]
description = "Lint GitHub Actions workflows with actionlint"
run = "actionlint"

[tasks.lint-skills]
description = "Validate SKILL.md spec via waza check"
run = "bash tests/waza-spec.sh"

[tasks.lint-workflows]
description = "Audit GitHub Actions workflows for security issues with zizmor"
run = "zizmor --offline .github/workflows"

[tasks.lint-secrets]
description = "Scan the full git history for leaked secrets with gitleaks"
run = "gitleaks git --redact --no-banner ."

[tasks.lint-unicode]
description = "Scan tracked text files for hidden/invisible Unicode characters"
run = "bash scripts/check-hidden-unicode.sh"

[tasks.lint]
description = "Run all linters"
depends = ["lint-shell", "lint-actions", "lint-skills", "lint-workflows", "lint-secrets", "lint-unicode"]

# The AgentsView CLI is scoped to this task so the other mise jobs do not
# pull a 42 MB binary. Its Homebrew formula is a macOS-only cask, but the
# release also ships plain CLI tarballs, so it installs on Linux CI too.
# Pinning records the CLI version the agentsview-* skills are written for.
[tasks.test-agentsview-contract]
description = "Check the agentsview CLI surface cited by the agentsview-* skills"
tools = { "github:kenn-io/agentsview" = "v0.44.0" }
run = "bash tests/agentsview-cli-contract.sh"

[tasks.waza]
description = "Run Waza suites (all, --changed, or named)"
run = "bash evals/run-suites.sh"

# Scoped to this task, not `mise run lint`, so the other lint/test jobs do
# not pull SkillSpector (a git-installed uv tool, not a mise registry tool)
# on every run. Pinned by commit SHA (not the v2.12.0 tag) per this repo's
# GitHub Actions convention of pinning to an exact, immutable revision.
# Static analysis only (--no-llm): no LLM provider credentials are read or
# required. Gates on MEDIUM+ severity because SkillSpector's own exit code
# only fires past risk_score 50 (HIGH/CRITICAL) or, with --fail-on-findings,
# on every finding including LOW/INFO; neither matches "medium or above", so
# the task filters `.issues[].severity` itself instead.
[tasks.lint-skill-security]
description = "Scan published skills and plugins for security issues with SkillSpector (static analysis only)"
# mise runs tasks with `sh -c`, which is dash on Ubuntu and rejects pipefail.
shell = "bash -c"
run = '''
set +e
set -u
set -o pipefail
SKILLSPECTOR_REF="c7958a3268d9498644b22edb75d0f051bbc8cbfc" # v2.12.0
SKILLSPECTOR="uvx --python 3.12 --from git+https://github.com/NVIDIA/skillspector.git@${SKILLSPECTOR_REF} skillspector"
BASELINE=".skillspector-baseline.yaml"
exit_code=0
for d in skills/*/ plugins/*/; do
  d="${d%/}"
  report="$(mktemp)"
  $SKILLSPECTOR scan "$d" --no-llm --format json --baseline "$BASELINE" --output "$report" >/dev/null
  rc=$?
  if [ "$rc" -eq 2 ]; then
    printf 'ERROR: %s (SkillSpector scan failed, see output above)\n' "$d"
    exit_code=1
    rm -f "$report"
    continue
  fi
  # Read the report straight off disk with jq; never round-trip it through
  # `echo`, whose backslash-escape handling differs by shell (POSIX sh
  # interprets `\n`/`\t` by default) and can turn a validly JSON-escaped
  # multi-line match into raw control bytes that jq then refuses to parse.
  count="$(jq '[.issues[] | select(.severity=="MEDIUM" or .severity=="HIGH" or .severity=="CRITICAL")] | length' "$report")"
  jq_rc=$?
  if [ "$jq_rc" -ne 0 ]; then
    printf 'ERROR: %s (could not parse SkillSpector JSON report)\n' "$d"
    exit_code=1
    rm -f "$report"
    continue
  fi
  if [ "$count" -gt 0 ]; then
    printf 'FAIL: %s (%s finding(s) at MEDIUM+ severity not covered by the baseline)\n' "$d" "$count"
    jq -r '.issues[] | select(.severity=="MEDIUM" or .severity=="HIGH" or .severity=="CRITICAL") | "  [\(.severity)] \(.id): \(.location.file):\(.location.start_line // "?")"' "$report"
    exit_code=1
  else
    printf 'PASS: %s\n' "$d"
  fi
  rm -f "$report"
done
exit $exit_code
'''
